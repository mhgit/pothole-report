[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pothole_report"]

[project]
name = "pothole-report"
version = "0.1.0"
description = "Extract GPS from pothole photos and output postcode, map link, and description for UK Fill That Hole reporting"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "geopy>=2.5.0",
    "keyring>=25.7.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
report-pothole = "pothole_report.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Ruff's default rule set is not stable across releases: 0.16 expanded it from
# ~59 rules to ~413. Select rules explicitly so an upgrade never silently
# changes what CI enforces.
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle: imports
    "E7",  # pycodestyle: statements
    "E9",  # pycodestyle: runtime/syntax errors
    "F",   # pyflakes
    "I",   # isort: import ordering
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.1",
]
